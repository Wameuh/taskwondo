services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: e2euser
      POSTGRES_PASSWORD: e2epass
      POSTGRES_DB: e2edb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2euser"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"

  minio:
    # Upstream minio/minio was removed from Docker Hub and Quay on 2025-10-23
    # (source-only distribution). Chainguard rebuilds the same binary.
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: e2eminioaccess
      MINIO_ROOT_PASSWORD: e2eminiosecret
    restart: "no"

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_started
    # The Chainguard server image has no mc — readiness is polled here instead
    # of a healthcheck on the minio service.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 e2eminioaccess e2eminiosecret;
      for i in $$(seq 1 30); do
        mc ready local && break;
        sleep 1;
      done;
      mc mb --ignore-existing local/taskwondo-attachments;
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/messages"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: "no"

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    environment:
      API_PORT: "8080"
      DATABASE_URL: "postgres://e2euser:e2epass@postgres:5432/e2edb?sslmode=disable"
      JWT_SECRET: "e2e-test-jwt-secret-at-least-32-chars-long"
      STORAGE_ENDPOINT: "minio:9000"
      STORAGE_ACCESS_KEY: "e2eminioaccess"
      STORAGE_SECRET_KEY: "e2eminiosecret"
      STORAGE_BUCKET: "taskwondo-attachments"
      STORAGE_USE_SSL: "false"
      ADMIN_EMAIL: "admin@e2e.test"
      ADMIN_PASSWORD: "E2eAdminPass123!"
      AUTH_RATE_LIMIT: "5000"
      AUTH_RATE_BURST: "500"
      BASE_URL: "http://web:80"
      NATS_URL: "nats://nats:4222"
      LOG_LEVEL: "info"
      LOG_FORMAT: "text"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: "no"

  worker:
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://e2euser:e2epass@postgres:5432/e2edb?sslmode=disable"
      JWT_SECRET: "e2e-test-jwt-secret-at-least-32-chars-long"
      STORAGE_ENDPOINT: "minio:9000"
      STORAGE_ACCESS_KEY: "e2eminioaccess"
      STORAGE_SECRET_KEY: "e2eminiosecret"
      STORAGE_BUCKET: "taskwondo-attachments"
      NATS_URL: "nats://nats:4222"
      SLA_MONITOR_INTERVAL: "3s"
      LOG_LEVEL: "info"
      LOG_FORMAT: "text"
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    # No host port: the E2E stack is fully internal. Playwright reaches the
    # frontend over the Compose network at http://web:80 (see playwright BASE_URL).
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  playwright:
    build:
      context: ./test/e2e
      dockerfile: Dockerfile
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      BASE_URL: "http://web:80"
      ADMIN_EMAIL: "admin@e2e.test"
      ADMIN_PASSWORD: "E2eAdminPass123!"
      MAILPIT_URL: "http://mailpit:8025"
    volumes:
      - ./test/e2e/test-results:/e2e/test-results
      - ./test/e2e/playwright-report:/e2e/playwright-report
    restart: "no"
