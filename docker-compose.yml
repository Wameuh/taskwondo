services:
  api:
    image: ghcr.io/marcoshack/taskwondo/api:${IMAGE_TAG:-latest}
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile.api
      args:
        - GOPROXY
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      nats:
        condition: service_healthy
    env_file: .env
    environment:
      # Always listen on port 8080 inside the container
      - API_PORT=8080
      # Always connect to postgres on port :5432 as it connectes directly through docker network, not the mapped port
      - DATABASE_URL=postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-taskwondo}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?required — generate a random string of at least 32 chars}
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:?required}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:?required}
      - STORAGE_BUCKET=${MINIO_BUCKET:-taskwondo-attachments}
      - NATS_URL=nats://nats:4222
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ghcr.io/marcoshack/taskwondo/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-taskwondo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?required}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: ghcr.io/marcoshack/taskwondo/worker:${IMAGE_TAG:-latest}
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile.worker
      args:
        - GOPROXY
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-taskwondo}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?required — generate a random string of at least 32 chars}
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:?required}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:?required}
      - STORAGE_BUCKET=${MINIO_BUCKET:-taskwondo-attachments}
      - NATS_URL=nats://nats:4222
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    # Upstream minio/minio was removed from Docker Hub and Quay on 2025-10-23
    # (source-only distribution). Chainguard rebuilds the same binary.
    image: cgr.dev/chainguard/minio:latest
    # Chainguard's image runs as nonroot uid 65532; the named volume needs root.
    user: "0"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_started
    # The image's entrypoint is mc itself; MC_HOST_<alias> carries the
    # credentials so no shell is required.
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-taskwondo-attachments}"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?required}:${MINIO_ROOT_PASSWORD:?required}@minio:9000
    restart: "no"

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    profiles: ["semantic-search"]
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # Pull the embedding model on first startup
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["semantic-search"]
    depends_on:
      - ollama
    restart: "no"
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434

volumes:
  pgdata:
  miniodata:
  natsdata:
  ollama_data:
